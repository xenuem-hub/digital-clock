<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Clock</title>
</head>
<body>
  <main class="screen">
    <!-- LEFT: DIGITAL CLOCK -->
    <section class="left" aria-label="Digital clock">
      <svg class="digitalSvg" id="digitalSvg" viewBox="0 0 260 180" role="img" aria-label="Digital time">
        <!-- Rounded-rectangle tick ring -->
        <path id="ringPath" class="ringPath"
              d="M 55 20
                 H 205
                 A 20 20 0 0 1 225 40
                 V 140
                 A 20 20 0 0 1 205 160
                 H 55
                 A 20 20 0 0 1 35 140
                 V 40
                 A 20 20 0 0 1 55 20
                 Z" />
        <g id="ringTicks"></g>

        <!-- Time text -->
        <text id="timeText" class="timeText" x="130" y="102">00:00</text>
      </svg>
    </section>

    <!-- RIGHT: CALENDAR (same as before) -->
    <section class="right" aria-label="Calendar">
      <div class="monthTitle" id="monthTitle"></div>

      <div class="dowRow" aria-hidden="true">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>

      <div class="calGrid" id="calGrid" role="grid" aria-label="Month grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
